<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Portaria PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #eef1f5;
    margin: 0;
}

/* HEADER */
.header {
    background: #7a0f3c;
    color: white;
    padding: 15px;
    text-align: center;
}

.header img {
    width: 120px;
    margin-bottom: 5px;
}

/* DASHBOARD */
.dashboard {
    display: flex;
    gap: 10px;
    padding: 10px;
}

.card-dash {
    flex: 1;
    background: white;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
}

/* CONTAINER */
.container {
    padding: 10px;
}

/* BOX */
.box {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 10px;
}

/* INPUT */
input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

/* BOTÃO */
.btn {
    margin-top: 10px;
    background: #7a0f3c;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    width: 100%;
}

/* CARD */
.card {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 10px;
    position: relative;
}

/* BOTÃO EDITAR */
.btn-editar {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #7a0f3c;
    color: white;
    border: none;
    width: 35px;
    height: 35px;
    border-radius: 50%;
}

/* BOTÃO PDF */
.btn-pdf {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #7a0f3c;
    color: white;
    border: none;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    font-size: 20px;
}

/* MODAL */
.modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    padding: 20px;
    border-radius: 12px;
    width: 90%;
}
</style>
</head>

<body>

<div class="header">
    <img src="./logo.png" onerror="this.style.display='none'">
    <div>📋 Sistema de Portaria</div>
</div>

<div class="dashboard">
    <div class="card-dash">
        Moradores
        <h2 id="totalMoradores">0</h2>
    </div>
    <div class="card-dash">
        Visitantes
        <h2 id="totalVisitantes">0</h2>
    </div>
    <div class="card-dash">
        Hoje
        <h2 id="dataHoje"></h2>
    </div>
</div>

<div class="container">

<div class="box">
    <input id="nome" placeholder="Nome">
    <input id="apto" placeholder="Apartamento">
    <button class="btn" onclick="addMorador()">Cadastrar</button>
</div>

<div class="box">
    <input id="busca" placeholder="Buscar..." onkeyup="buscar()">
</div>

<div id="lista"></div>

</div>

<button class="btn-pdf" onclick="gerarPDF()">💾</button>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h3>Editar</h3>
        <input id="editNome">
        <input id="editApto">
        <input id="editVisitantes">
        <button class="btn" onclick="salvarEdicao()">Salvar</button>
        <button class="btn" onclick="fecharModal()">Cancelar</button>
    </div>
</div>

<script>

let moradores = JSON.parse(localStorage.getItem("moradores")) || [];
let indexAtual = null;

function salvar() {
    localStorage.setItem("moradores", JSON.stringify(moradores));
}

function addMorador() {
    if (!nome.value || !apto.value) return alert("Preencha tudo");

    moradores.push({ nome: nome.value, apto: apto.value, visitantes: [] });

    salvar();
    mostrar();

    nome.value = "";
    apto.value = "";
}

function abrirModal(i) {
    indexAtual = i;

    editNome.value = moradores[i].nome;
    editApto.value = moradores[i].apto;
    editVisitantes.value = moradores[i].visitantes.join(", ");

    modal.style.display = "flex";
}

function fecharModal() {
    modal.style.display = "none";
}

function salvarEdicao() {
    moradores[indexAtual].nome = editNome.value;
    moradores[indexAtual].apto = editApto.value;
    moradores[indexAtual].visitantes = editVisitantes.value
        ? editVisitantes.value.split(",").map(v => v.trim())
        : [];

    salvar();
    fecharModal();
    mostrar();
}

function buscar() {
    mostrar(busca.value.toLowerCase());
}

function atualizarDashboard() {
    totalMoradores.innerText = moradores.length;

    let totalVisitantes = moradores.reduce((t, m) => t + m.visitantes.length, 0);
    totalVisitantesEl = document.getElementById("totalVisitantes");
    totalVisitantesEl.innerText = totalVisitantes;

    dataHoje.innerText = new Date().toLocaleDateString("pt-BR");
}

function mostrar(filtro = "") {
    lista.innerHTML = "";

    moradores
    .filter(m => m.nome.toLowerCase().includes(filtro))
    .forEach((m, i) => {
        lista.innerHTML += `
        <div class="card">
            <strong>${m.nome}</strong><br>
            Apto: ${m.apto}<br>
            Visitantes: ${m.visitantes.join(", ") || "Nenhum"}
            <button class="btn-editar" onclick="abrirModal(${i})">✏️</button>
        </div>
        `;
    });

    atualizarDashboard();
}

function gerarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    let y = 20;

    moradores.forEach(m => {
        doc.text(`${m.nome} - Apto ${m.apto}`, 10, y);
        y += 5;
        doc.text(`Visitantes: ${m.visitantes.join(", ") || "Nenhum"}`, 10, y);
        y += 10;
    });

    doc.save("moradores.pdf");
}

mostrar();

</script>

</body>
</html>
