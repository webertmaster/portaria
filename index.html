<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Portaria PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { margin:0; font-family:Arial; display:flex; }

/* MENU */
.sidebar {
 width:220px;
 background:#7a0f3c;
 color:white;
 height:100vh;
 padding:10px;
}

.sidebar h2 { text-align:center; }

.sidebar button {
 width:100%;
 margin-top:10px;
 padding:10px;
 border:none;
 background:#a31d52;
 color:white;
 border-radius:6px;
}

/* CONTEÚDO */
.content {
 flex:1;
 padding:15px;
 background:#eef1f5;
}

.box {
 background:white;
 padding:15px;
 border-radius:10px;
 margin-bottom:10px;
}

input, select {
 width:100%;
 padding:10px;
 margin-top:5px;
 border-radius:8px;
 border:1px solid #ccc;
}

.btn {
 background:#7a0f3c;
 color:white;
 border:none;
 padding:10px;
 margin-top:10px;
 width:100%;
 border-radius:8px;
}

.card {
 background:white;
 padding:10px;
 margin-top:10px;
 border-radius:8px;
}

/* ESCONDER TELAS */
.tela { display:none; }
.ativa { display:block; }

/* CANVAS */
canvas { border:1px solid #000; }
</style>
</head>

<body>

<!-- MENU -->
<div class="sidebar">
<h2>🏢 Portaria</h2>

<button onclick="trocarTela('moradores')">👤 Moradores</button>
<button onclick="trocarTela('reservas')">📅 Reservas</button>

</div>

<!-- CONTEÚDO -->
<div class="content">

<!-- MORADORES -->
<div id="moradores" class="tela ativa">

<div class="box">
<h3>Cadastrar</h3>
<input id="nome" placeholder="Nome">
<input id="apto" placeholder="Apartamento">
<input id="secretaria" placeholder="Secretária">
<input id="visitantes" placeholder="Visitantes (vírgula)">
<button class="btn" onclick="addMorador()">Cadastrar</button>
</div>

<div class="box">
<input id="busca" placeholder="Buscar..." onkeyup="buscar()">
</div>

<div id="lista"></div>

</div>

<!-- RESERVAS -->
<div id="reservas" class="tela">

<div class="box">
<h3>Nova Reserva</h3>

<select id="tipoReserva">
<option>Churrasqueira</option>
<option>Salão</option>
<option>Combo</option>
</select>

<input type="date" id="dataReserva">
<input type="time" id="horaReserva">

<input id="responsavel" placeholder="Nome do responsável">

<p>Assinatura:</p>
<canvas id="canvas" width="300" height="150"></canvas>
<button onclick="limpar()">Limpar</button>

<button class="btn" onclick="salvarReserva()">Agendar</button>
</div>

<div class="box">
<h3>Reservas</h3>
<div id="listaReservas"></div>
</div>

</div>

</div>

<script>

/* MENU */
function trocarTela(id){
document.querySelectorAll(".tela").forEach(t=>t.classList.remove("ativa"));
document.getElementById(id).classList.add("ativa");
}

/* MORADORES */
let moradores = JSON.parse(localStorage.getItem("moradores")) || [];

function salvar(){
localStorage.setItem("moradores", JSON.stringify(moradores));
}

function addMorador(){
if(!nome.value||!apto.value) return alert("Preencha");

moradores.push({
nome:nome.value,
apto:apto.value,
secretaria:secretaria.value,
visitantes:visitantes.value?visitantes.value.split(","):[]
});

salvar();
mostrar();
nome.value=""; apto.value=""; secretaria.value=""; visitantes.value="";
}

function buscar(){
let t=busca.value.toLowerCase();
lista.innerHTML="";
moradores.filter(m=>m.nome.toLowerCase().includes(t)).forEach(render);
}

function render(m,i){
lista.innerHTML+=`
<div class="card">
<b>${m.nome}</b><br>
Apto: ${m.apto}<br>
Visitantes: ${m.visitantes.join(", ")}
</div>`;
}

function mostrar(){
lista.innerHTML="";
moradores.forEach(render);
}

/* RESERVAS */
let reservas = JSON.parse(localStorage.getItem("reservas")) || [];

function salvarReserva(){

if(!responsavel.value) return alert("Digite o responsável");

let assinatura = canvas.toDataURL();

reservas.push({
tipo:tipoReserva.value,
data:dataReserva.value,
hora:horaReserva.value,
responsavel:responsavel.value,
assinatura
});

localStorage.setItem("reservas", JSON.stringify(reservas));

alert("Reserva salva!");
mostrarReservas();
}

/* LISTAR */
function mostrarReservas(){
listaReservas.innerHTML="";
reservas.forEach(r=>{
listaReservas.innerHTML+=`
<div class="card">
${r.tipo} - ${r.data} ${r.hora}<br>
${r.responsavel}
</div>`;
});
}

/* ASSINATURA FUNCIONANDO */
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let desenhando = false;

canvas.addEventListener("mousedown", ()=> desenhando=true);
canvas.addEventListener("mouseup", ()=> desenhando=false);
canvas.addEventListener("mousemove", e=>{
if(!desenhando) return;
ctx.lineTo(e.offsetX,e.offsetY);
ctx.stroke();
});

canvas.addEventListener("touchstart", ()=> desenhando=true);
canvas.addEventListener("touchend", ()=> desenhando=false);
canvas.addEventListener("touchmove", e=>{
let rect = canvas.getBoundingClientRect();
let x = e.touches[0].clientX - rect.left;
let y = e.touches[0].clientY - rect.top;
ctx.lineTo(x,y);
ctx.stroke();
});

function limpar(){
ctx.clearRect(0,0,300,150);
}

/* INICIAR */
mostrar();
mostrarReservas();

</script>

</body>
</html>
