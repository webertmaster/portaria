<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portaria PRO</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    display:flex;
    background:#eef1f5;
}

/* MENU */

.sidebar{
    width:230px;
    background:#7a0f3c;
    height:100vh;
    color:white;
    padding:20px;
    position:fixed;
    left:0;
    top:0;
}

.sidebar h2{
    text-align:center;
    margin-bottom:30px;
}

.sidebar button{
    width:100%;
    border:none;
    padding:12px;
    margin-bottom:10px;
    border-radius:8px;
    background:#a61c56;
    color:white;
    cursor:pointer;
    font-size:15px;
}

/* CONTEÚDO */

.content{
    margin-left:230px;
    width:100%;
    padding:15px;
}

.box{
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

input, select{
    width:100%;
    padding:12px;
    margin-top:8px;
    border-radius:8px;
    border:1px solid #ccc;
}

.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-top:10px;
    background:#7a0f3c;
    color:white;
    cursor:pointer;
}

.card{
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
}

.tela{
    display:none;
}

.ativa{
    display:block;
}

canvas{
    border:1px solid #ccc;
    border-radius:8px;
    margin-top:10px;
    width:100%;
    background:white;
}

.badge{
    display:inline-block;
    background:#7a0f3c;
    color:white;
    padding:5px 10px;
    border-radius:20px;
    margin-top:8px;
    font-size:13px;
}

</style>
</head>

<body>

<!-- MENU -->

<div class="sidebar">

    <h2>🏢 Portaria</h2>

    <button onclick="trocarTela('moradores')">
        👤 Moradores
    </button>

    <button onclick="trocarTela('reservas')">
        📅 Reservas
    </button>

</div>

<!-- CONTEÚDO -->

<div class="content">

<!-- MORADORES -->

<div id="moradores" class="tela ativa">

    <div class="box">

        <h3>Cadastrar Morador</h3>

        <input id="nome" placeholder="Nome do morador">

        <input id="apto" placeholder="Apartamento">

        <input id="secretaria" placeholder="Secretária">

        <input id="visitantes" placeholder="Visitantes separados por vírgula">

        <button class="btn" onclick="addMorador()">
            Cadastrar
        </button>

    </div>

    <div class="box">

        <input id="busca" placeholder="Buscar morador..." onkeyup="buscar()">

    </div>

    <div id="lista"></div>

</div>

<!-- RESERVAS -->

<div id="reservas" class="tela">

    <div class="box">

        <h3>Nova Reserva</h3>

        <select id="tipoReserva">
            <option>Churrasqueira</option>
            <option>Salão de Festa</option>
            <option>Combo</option>
        </select>

        <input type="date" id="dataReserva">

        <input type="time" id="horaReserva">

        <input id="responsavel" placeholder="Nome do responsável">

        <p style="margin-top:15px;">Assinatura:</p>

        <canvas id="canvas" width="500" height="200"></canvas>

        <button class="btn" onclick="limparAssinatura()">
            Limpar Assinatura
        </button>

        <button class="btn" onclick="salvarReserva()">
            Agendar Reserva
        </button>

    </div>

    <div class="box">

        <h3>Reservas Registradas</h3>

        <div id="listaReservas"></div>

    </div>

</div>

</div>

<script>

/* =========================
MENU
========================= */

function trocarTela(id){

    document
    .querySelectorAll(".tela")
    .forEach(t => t.classList.remove("ativa"));

    document
    .getElementById(id)
    .classList.add("ativa");
}

/* =========================
MORADORES
========================= */

let moradores =
JSON.parse(localStorage.getItem("moradores")) || [];

function salvarMoradores(){

    localStorage.setItem(
        "moradores",
        JSON.stringify(moradores)
    );
}

function addMorador(){

    if(!nome.value || !apto.value){

        alert("Preencha os campos");
        return;
    }

    moradores.push({

        nome:nome.value,

        apto:apto.value,

        secretaria:secretaria.value || "",

        visitantes: visitantes.value
            ? visitantes.value
                .split(",")
                .map(v => v.trim())
            : []

    });

    salvarMoradores();

    mostrarMoradores();

    nome.value="";
    apto.value="";
    secretaria.value="";
    visitantes.value="";
}

function buscar(){

    let termo = busca.value.toLowerCase();

    lista.innerHTML = "";

    moradores
    .filter(m =>
        m.nome.toLowerCase().includes(termo)
    )
    .forEach(renderMorador);
}

function renderMorador(m){

    lista.innerHTML += `

    <div class="card">

        <h3>${m.nome}</h3>

        <div class="badge">
            Apto ${m.apto}
        </div>

        <p style="margin-top:10px;">
            <b>Secretária:</b>
            ${m.secretaria || "Nenhuma"}
        </p>

        <p style="margin-top:8px;">
            <b>Visitantes:</b>
            ${m.visitantes.join(", ") || "Nenhum"}
        </p>

    </div>

    `;
}

function mostrarMoradores(){

    lista.innerHTML = "";

    moradores.forEach(renderMorador);
}

/* =========================
RESERVAS
========================= */

let reservas =
JSON.parse(localStorage.getItem("reservas")) || [];

function salvarReserva(){

    if(
        !responsavel.value ||
        !dataReserva.value ||
        !horaReserva.value
    ){

        alert("Preencha todos os dados");
        return;
    }

    /* BLOQUEAR RESERVAS */

    let conflito = reservas.find(r =>

        r.data === dataReserva.value &&
        r.hora === horaReserva.value &&

        (

            r.tipo === tipoReserva.value ||

            r.tipo === "Combo" ||

            tipoReserva.value === "Combo"

        )
    );

    if(conflito){

        alert("⚠️ Já existe reserva nesse horário!");
        return;
    }

    let assinatura = canvas.toDataURL();

    reservas.push({

        tipo: tipoReserva.value,

        data: dataReserva.value,

        hora: horaReserva.value,

        responsavel: responsavel.value,

        assinatura

    });

    localStorage.setItem(
        "reservas",
        JSON.stringify(reservas)
    );

    alert("✅ Reserva cadastrada!");

    mostrarReservas();

    responsavel.value="";
    dataReserva.value="";
    horaReserva.value="";

    limparAssinatura();
}

function mostrarReservas(){

    listaReservas.innerHTML = "";

    reservas.forEach(r => {

        listaReservas.innerHTML += `

        <div class="card">

            <h3>${r.tipo}</h3>

            <div class="badge">
                ${r.data}
            </div>

            <p style="margin-top:10px;">
                <b>Horário:</b>
                ${r.hora}
            </p>

            <p style="margin-top:8px;">
                <b>Responsável:</b>
                ${r.responsavel}
            </p>

        </div>

        `;
    });
}

/* =========================
ASSINATURA
========================= */

let canvas = document.getElementById("canvas");

let ctx = canvas.getContext("2d");

let desenhando = false;

/* MOUSE */

canvas.addEventListener("mousedown", () => {

    desenhando = true;

    ctx.beginPath();
});

canvas.addEventListener("mouseup", () => {

    desenhando = false;
});

canvas.addEventListener("mousemove", desenhar);

/* TOQUE */

canvas.addEventListener("touchstart", (e) => {

    e.preventDefault();

    desenhando = true;

    ctx.beginPath();
});

canvas.addEventListener("touchend", () => {

    desenhando = false;
});

canvas.addEventListener("touchmove", desenharTouch);

/* DESENHAR */

function desenhar(e){

    if(!desenhando) return;

    ctx.lineWidth = 2;

    ctx.lineCap = "round";

    ctx.lineTo(e.offsetX, e.offsetY);

    ctx.stroke();
}

function desenharTouch(e){

    if(!desenhando) return;

    e.preventDefault();

    let rect = canvas.getBoundingClientRect();

    let x =
        e.touches[0].clientX - rect.left;

    let y =
        e.touches[0].clientY - rect.top;

    ctx.lineWidth = 2;

    ctx.lineCap = "round";

    ctx.lineTo(x, y);

    ctx.stroke();
}

function limparAssinatura(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}

/* =========================
INICIAR
========================= */

mostrarMoradores();

mostrarReservas();

</script>

</body>
</html>
