<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Portaria PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #eef1f5;
    margin: 0;
}

/* HEADER */
.header {
    background: #7a0f3c;
    color: white;
    padding: 15px;
    text-align: center;
}

.header img {
    width: 120px;
    margin-bottom: 5px;
}

/* CONTAINER */
.container {
    padding: 15px;
}

/* BOX */
.box {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

/* INPUT */
input {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

/* BOTÃO */
.btn {
    margin-top: 10px;
    background: #7a0f3c;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    width: 100%;
}

/* CARD */
.card {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 10px;
    position: relative;
}

/* BOTÃO EDITAR */
.btn-editar {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #7a0f3c;
    color: white;
    border: none;
    width: 35px;
    height: 35px;
    border-radius: 50%;
}

/* MODAL */
.modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: white;
    padding: 20px;
    border-radius: 12px;
    width: 90%;
}
</style>
</head>

<body>

<div class="header">
    <img src="logo.png">
    <div>📋 Sistema de Portaria</div>
</div>

<div class="container">

<button class="btn" onclick="gerarPDF()">📥 Baixar PDF</button>

<div class="box">
    <h3>Cadastrar Morador</h3>
    <input id="nome" placeholder="Nome">
    <input id="apto" placeholder="Apartamento">
    <button class="btn" onclick="addMorador()">Cadastrar</button>
</div>

<div class="box">
    <h3>Buscar</h3>
    <input id="busca" placeholder="Digite..." onkeyup="buscar()">
</div>

<div id="lista"></div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h3>Editar</h3>
        <input id="editNome">
        <input id="editApto">
        <input id="editVisitantes">
        <button class="btn" onclick="salvarEdicao()">Salvar</button>
        <button class="btn" onclick="fecharModal()">Cancelar</button>
    </div>
</div>

<script>

let moradores = JSON.parse(localStorage.getItem("moradores")) || [];

let indexAtual = null;

function salvar() {
    localStorage.setItem("moradores", JSON.stringify(moradores));
}

function addMorador() {
    if (!nome.value || !apto.value) return alert("Preencha tudo");

    moradores.push({
        nome: nome.value,
        apto: apto.value,
        visitantes: []
    });

    salvar();
    mostrar();

    nome.value = "";
    apto.value = "";
}

function abrirModal(i) {
    indexAtual = i;

    editNome.value = moradores[i].nome;
    editApto.value = moradores[i].apto;
    editVisitantes.value = moradores[i].visitantes.join(", ");

    modal.style.display = "flex";
}

function fecharModal() {
    modal.style.display = "none";
}

function salvarEdicao() {
    moradores[indexAtual].nome = editNome.value;
    moradores[indexAtual].apto = editApto.value;
    moradores[indexAtual].visitantes = editVisitantes.value
        ? editVisitantes.value.split(",").map(v => v.trim())
        : [];

    salvar();
    fecharModal();
    mostrar();
}

function buscar() {
    mostrar(busca.value.toLowerCase());
}

function mostrar(filtro = "") {
    lista.innerHTML = "";

    moradores
    .filter(m => m.nome.toLowerCase().includes(filtro))
    .forEach((m, i) => {
        lista.innerHTML += `
        <div class="card">
            <strong>${m.nome}</strong><br>
            Apto: ${m.apto}<br>
            Visitantes: ${m.visitantes.join(", ") || "Nenhum"}

            <button class="btn-editar" onclick="abrirModal(${i})">✏️</button>
        </div>
        `;
    });
}

function gerarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    let y = 20;

    // LOGO
    const img = new Image();
    img.src = "logo.png";

    img.onload = function() {
        doc.addImage(img, "PNG", 70, 5, 70, 30);

        y = 45;

        doc.setFontSize(14);
        doc.text("Lista de Moradores", 10, y);
        y += 10;

        moradores.forEach(m => {
            doc.setFontSize(10);

            doc.text(`${m.nome} - Apto ${m.apto}`, 10, y);
            y += 5;

            doc.text(`Visitantes: ${m.visitantes.join(", ") || "Nenhum"}`, 10, y);
            y += 8;

            if (y > 270) {
                doc.addPage();
                y = 10;
            }
        });

        doc.save("moradores.pdf");
    }
}

mostrar();

</script>

</body>
</html>
