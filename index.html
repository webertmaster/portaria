<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Portaria PRO</title>

<style>
body {
    font-family: Arial;
    background: #eef1f5;
    padding: 20px;
}

h2 {
    text-align: center;
}

.box {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
}

input, button {
    padding: 10px;
    margin: 5px 0;
    width: 100%;
    font-size: 14px;
}

button {
    background: #007bff;
    color: white;
    border: none;
    cursor: pointer;
}

.card {
    background: white;
    padding: 15px;
    margin-top: 10px;
    border-radius: 8px;
}
</style>
</head>

<body>

<h2>🏢 Sistema de Portaria</h2>

<div class="box">
    <h3>Cadastrar Morador</h3>
    <input type="text" id="nome" placeholder="Nome do morador">
    <input type="text" id="apto" placeholder="Apartamento">
    <button onclick="addMorador()">Cadastrar</button>
</div>

<div class="box">
    <h3>Buscar</h3>
    <input type="text" id="busca" placeholder="Digite o nome..." onkeyup="buscar()">
</div>

<div id="lista"></div>

<script>

// DADOS INICIAIS

{ nome: "Cíntia", apto: "1501", visitantes: ["Pastor Mair"] }
];

// salvar no navegador
function salvar() {
    localStorage.setItem("moradores", JSON.stringify(moradores));
}

// adicionar morador
function addMorador() {
    const nome = document.getElementById("nome").value;
    const apto = document.getElementById("apto").value;

    if (!nome || !apto) {
        alert("Preencha tudo!");
        return;
    }

    moradores.push({ nome, apto, visitantes: [] });

    salvar();
    mostrar();

    document.getElementById("nome").value = "";
    document.getElementById("apto").value = "";
}

// adicionar visitante
function addVisitante(index) {
    const nomeVisitante = prompt("Nome do visitante:");
    if (!nomeVisitante) return;

    moradores[index].visitantes.push(nomeVisitante);
    salvar();
    mostrar();
}

// editar morador
function editarMorador(index) {
    const novoNome = prompt("Editar nome:", moradores[index].nome);
    if (!novoNome) return;

    const novoApto = prompt("Editar apartamento:", moradores[index].apto);
    if (!novoApto) return;

    moradores[index].nome = novoNome;
    moradores[index].apto = novoApto;

    salvar();
    mostrar();
}

// busca
function buscar() {
    const termo = document.getElementById("busca").value.toLowerCase();
    mostrar(termo);
}

// mostrar lista
function mostrar(filtro = "") {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    moradores
    .filter(m => m.nome.toLowerCase().includes(filtro))
    .forEach((m, index) => {
        lista.innerHTML += `
            <div class="card">
                <strong>${m.nome}</strong><br>
                Apto: ${m.apto}<br>
                Visitantes: ${m.visitantes.join(", ") || "Nenhum"}<br><br>

                <button onclick="addVisitante(${index})">+ Visitante</button>
                <button onclick="editarMorador(${index})">✏️ Editar</button>
            </div>
        `;
    });
}

// iniciar
mostrar();

</script>

</body>
</html>
