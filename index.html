<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Portaria PRO</title>

<style>
body {
    font-family: Arial;
    background: #eef1f5;
    padding: 20px;
}

h2 {
    text-align: center;
}

.box {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
}

input, button {
    padding: 10px;
    margin: 5px 0;
    width: 100%;
    font-size: 14px;
}

button {
    background: #007bff;
    color: white;
    border: none;
    cursor: pointer;
}

.card {
    background: white;
    padding: 15px;
    margin-top: 10px;
    border-radius: 8px;
    position: relative;
}

/* botão lápis */
.btn-editar {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #007bff;
    border: none;
    color: white;
    padding: 8px;
    border-radius: 50%;
    cursor: pointer;
}
</style>
</head>

<body>

<h2>🏢 Sistema de Portaria</h2>

<div class="box">
    <h3>Cadastrar Morador</h3>
    <input type="text" id="nome" placeholder="Nome do morador">
    <input type="text" id="apto" placeholder="Apartamento">
    <button onclick="addMorador()">Cadastrar</button>
</div>

<div class="box">
    <h3>Buscar</h3>
    <input type="text" id="busca" placeholder="Digite o nome..." onkeyup="buscar()">
</div>

<div id="lista"></div>

<script>

let moradores = JSON.parse(localStorage.getItem("moradores")) || [
{ nome: "Vanessa", apto: "301", visitantes: ["Amanda"] },
{ nome: "João Marcelo", apto: "401", visitantes: ["Diana"] }
];

function salvar() {
    localStorage.setItem("moradores", JSON.stringify(moradores));
}

function addMorador() {
    const nome = document.getElementById("nome").value;
    const apto = document.getElementById("apto").value;

    if (!nome || !apto) {
        alert("Preencha tudo!");
        return;
    }

    moradores.push({ nome, apto, visitantes: [] });

    salvar();
    mostrar();

    document.getElementById("nome").value = "";
    document.getElementById("apto").value = "";
}

// 🔥 EDITAR COMPLETO (morador + visitantes)
function editarMorador(index) {

    const novoNome = prompt("Editar nome:", moradores[index].nome);
    if (novoNome === null) return;

    const novoApto = prompt("Editar apartamento:", moradores[index].apto);
    if (novoApto === null) return;

    const visitantesTexto = prompt(
        "Editar visitantes (separe por vírgula):",
        moradores[index].visitantes.join(", ")
    );

    if (visitantesTexto === null) return;

    moradores[index].nome = novoNome;
    moradores[index].apto = novoApto;
    moradores[index].visitantes = visitantesTexto
        ? visitantesTexto.split(",").map(v => v.trim())
        : [];

    salvar();
    mostrar();
}

function buscar() {
    const termo = document.getElementById("busca").value.toLowerCase();
    mostrar(termo);
}

function mostrar(filtro = "") {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    moradores
    .filter(m => m.nome.toLowerCase().includes(filtro))
    .forEach((m, index) => {
        lista.innerHTML += `
            <div class="card">
                <strong>${m.nome}</strong><br>
                Apto: ${m.apto}<br>
                Visitantes: ${m.visitantes.join(", ") || "Nenhum"}

                <button onclick="editarMorador(${index})" class="btn-editar">✏️</button>
            </div>
        `;
    });
}

mostrar();

</script>

</body>
</html>
